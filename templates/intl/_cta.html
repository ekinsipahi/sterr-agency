<section class="section section--tight">
  <div class="container">
    <div class="cta reveal">
      <h2 class="h2">{{ ui.cta_title }}</h2>
      <p>{{ ui.cta_text }}</p>
      <div class="btn-row mt-m">
        <a class="btn btn--dark btn--lg" href="#contact">{{ ui.nav_cta }} {% include "partials/icons/arrow.svg" %}</a>
        <a class="btn btn--outline-dark btn--lg" href="{{ whatsapp_url }}" target="_blank" rel="noopener">{% include "partials/icons/whatsapp.svg" %} WhatsApp</a>
      </div>
    </div>
  </div>
</section>
