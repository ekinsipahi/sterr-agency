<div class="price-strip mt-m reveal">
  {% for pk in plans %}<a class="price-chip{% if pk.popular %} price-chip--popular{% endif %}" href="#start" data-pick="{{ pk.key }}"><span class="price-chip__unit">{{ pk.name }}</span><b>{{ pk.amount }}<small>{{ gu.per_month }}</small></b><span class="price-chip__days">{{ pk.headline }}</span></a>{% endfor %}
</div>
<p class="muted price-strip__note reveal">{{ gu.agency_line }} {{ gu.policy }}</p>
